# One scoped public-source evidence acquisition; retire push trigger after result.
name: AV candidate acquisition (no execution)
on:
  workflow_dispatch:
  push:
    branches: ['dev/ade-bootstrap-002']
    paths: ['.github/workflows/av-candidate-acquisition.yml']
permissions:
  contents: read
jobs:
  acquire:
    if: github.repository == 'gianpaolobol/aegis-ai' && github.ref == 'refs/heads/dev/ade-bootstrap-002'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Acquire fixed public wheel and check bytes without execution
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          candidate="$tmp/yara_x-1.24.0-cp39-abi3-win_amd64.whl"
          # No redirects, no pip, no import, no secrets, no artifact upload.
          curl --disable --proto '=https' --connect-timeout 10 --max-time 60 --max-filesize 16777216 --fail --silent --show-error --output "$candidate" 'https://files.pythonhosted.org/packages/8c/52/6381a0e38246dfd81965b5f24c34dcd20bf7bb73dc5795183cf746a8c305/yara_x-1.24.0-cp39-abi3-win_amd64.whl'
          python -I lab/av/verify_wheel.py --inspect "$candidate"
          python -I lab/av/verify_wheel.py --inventory "$candidate"
          echo 'Acquired and inventoried only; no execution, independent attestation or licensing approval.'
          rm -rf -- "$tmp"
          test ! -e "$tmp"
          trap - EXIT
