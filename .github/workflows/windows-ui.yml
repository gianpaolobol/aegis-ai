name: Windows development UI checks
on:
  pull_request:
    paths:
      - 'desktop/windows/**'
      - 'lab/av/**'
      - '.github/workflows/windows-ui.yml'
  push:
    branches: ['dev/**']
    paths:
      - 'desktop/windows/**'
      - 'lab/av/**'
      - '.github/workflows/windows-ui.yml'
permissions:
  contents: read
jobs:
  ui-checks:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse and test fixed command allowlist
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $path = Join-Path $PWD 'desktop/windows/Show-AegisAlpha.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'UI script parse failure' }
          & $path -SelfTest
          if (-not $?) { throw 'UI self-test failed' }

      - name: Run offline AV adapter mock regressions
        shell: powershell
        run: |
          python -I lab/av/yara_lab.py --mock-tests
          if ($LASTEXITCODE -ne 0) { throw 'AV adapter mock regressions failed' }

      - name: Run offline wheel preflight synthetic regressions
        shell: powershell
        run: |
          python -I lab/av/verify_wheel.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Wheel preflight regression failed' }

      - name: Run offline AV dependency review queue regressions
        shell: powershell
        run: |
          python -I lab/av/review_candidate.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'AV review queue regression failed' }

      - name: Run offline Cargo archive comparison regressions
        shell: powershell
        run: |
          python -I lab/av/crate_manifest.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Cargo archive regression failed' }

      - name: Reconcile retained offline AV dependency review queue
        shell: powershell
        run: |
          python -I lab/av/review_candidate.py --review-queue
          if ($LASTEXITCODE -ne 0) { throw 'Retained AV evidence inconsistent' }

      - name: Run offline publisher provenance preflight synthetic regressions
        shell: powershell
        run: |
          python -I lab/av/provenance_preflight.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Provenance preflight regressions failed' }
