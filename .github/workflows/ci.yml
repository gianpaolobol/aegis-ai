name: Rust policy CI
on:
  pull_request:
  push:
    branches: [main, "dev/**"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo +1.100.0 test --locked --offline --all-targets
      - run: cargo +1.100.0 build --locked --offline --release --bin aegis-policy
      - run: cargo +1.100.0 test --locked --offline --release --test cli_smoke
      - name: Rehearse unsigned Windows portable package (no upload)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
